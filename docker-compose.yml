services:
  frontend:
    build: ./frontend
    container_name: nextjs-frontend
    ports:
      - "3001:3000" # Access at http://localhost:3001
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000

    develop:
      watch:
        - path: ./frontend/package.json
          action: rebuild # Rebuild if you add new npm packages
        - path: ./frontend/next.config.js
          action: rebuild
        - path: ./frontend
          target: /app
          action: sync # Instantly sync code changes (Hot Reload)
          ignore:
            - node_modules/

  backend:
    build: ./backend
    container_name: nestjs-backend
    ports:
      - "3000:3000" # Access at http://localhost:3000
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules
    # environment:
    #   - DB_HOST=host.docker.internal
    #   - DB_PORT=3307 # Your SSH Tunnel port
    #   - DB_USER=yion69
    #   - DB_PASS=your_password
    #   - DB_NAME=your_db_name
    # extra_hosts:
    #   - "host.docker.internal:host-gateway" # Connects to your laptop's tunnel
    develop:
      watch:
        - path: ./backend/package.json
          action: rebuild
        - path: ./backend
          target: /app
          action: sync
          ignore:
            - node_modules/
            - dist/

networks:
  default:
    name: fullstack-network