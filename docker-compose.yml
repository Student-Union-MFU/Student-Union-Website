services:
  frontend:
    build: .
    container_name: nextjs-frontend
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    develop:
      watch:
        - path: ./package.json
          action: rebuild
        - path: ./next.config.ts
          action: rebuild
        - path: .
          target: /app
          action: sync
          ignore:
            - node_modules/

networks:
  default:
    name: student-union-network